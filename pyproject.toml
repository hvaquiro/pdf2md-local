[project]
name = "pdf2md-local"
version = "0.1.0"
description = "Conversión local (CPU) de PDF científicos a Markdown de alta fidelidad con Docling + PyMuPDF"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "hvaquiro" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling==2.128.0",
    "docling-core==2.97.0",
    "docling-ibm-models==4.0.2",
    "docling-parse==7.20.0",
    "pymupdf==1.28.2",
    "rapidocr==3.9.2",
    "requests>=2.31.0",
    "torch==2.14.0",
    "transformers==5.17.0",
]

[project.scripts]
pdf2md = "pdf2md.cli:main"
pdf2md-verificar = "pdf2md.verificar:main"
pdf2md-modelos = "pdf2md.modelos:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

# En Linux, PyPI sirve ruedas de torch con CUDA (varios GB); se fuerza la rueda solo-CPU
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["pdf2md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: pruebas que ejecutan Docling sobre un PDF completo (minutos)",
    "modelos: pruebas que requieren los modelos descargados con pdf2md-modelos",
]
addopts = "-m 'not slow and not modelos'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

